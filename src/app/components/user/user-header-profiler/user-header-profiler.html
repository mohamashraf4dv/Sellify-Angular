 <div class="dropdown-container">
        <div class="user-menu-trigger d-flex align-items-center">
          <div class="user-info d-none d-sm-flex flex-column text-end me-3">
            <span class="welcome-text">Welcome back,</span>
            <span class="user-name">{{userData()?.name | titlecase}}</span>
          </div>

          <div class="avatar-wrapper">
            @if(userData()?.picture){
            <img [src]="userData()?.picture" 
                 alt="Avatar of Alex Rivera" class="user-avatar shadow-sm">
            }@else {
                 <!-- <div class="user-avatar shadow-sm bg-primary text-white p-2 avatar-chars">{{userImage()}}</div> -->
                  <app-generate-image-of-first-char-two-words [name]="userData()?.name"></app-generate-image-of-first-char-two-words>
            }

            <div class="online-indicator" aria-hidden="true"></div>
          </div>
        </div>

        <ul class="custom-hover-menu" role="menu">
          <li>
            <a routerLink="/profile" class="hover-menu-item" role="menuitem">
              <i class="bi bi-person"></i>
              <span>Personal Profile</span>
            </a>
          </li>
          <!-- <li>
            <a href="#" class="hover-menu-item" role="menuitem">
              <i class="bi bi-gear"></i>
              <span>Account Settings</span>
            </a>
          </li> -->
          <li>
            <a routerLink="/orders" class="hover-menu-item border-bottom border-secondary mb-1 pb-2" role="menuitem">
              <i class="bi bi-credit-card"></i>
              <span>My Orders</span>
            </a>
          </li>
          <li>
            <a  class="hover-menu-item text-danger fw-bold" role="menuitem" (click)="signOut()">
              <i class="bi bi-box-arrow-right"></i>
              <span >Sign Out</span>
            </a>
          </li>
        </ul>
      </div>
