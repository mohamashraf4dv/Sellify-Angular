<mat-card class="product-card" appearance="outlined">
  <div class="image-container">
    <img mat-card-image src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Product Image">
    @if(true){
        <span class="category-badge bg-success">Best Seller</span>
    }@else{
    <span class="category-badge bg-warning">New Arrival</span>
    }
  </div>

  <mat-card-header>
    <mat-card-title class="product-title">Premium Shiba Edition</mat-card-title>
    <mat-card-subtitle class="price-tag">$100.00</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="stock-container">
  <div class="stock-labels">
    <span class="stock-status" [class.low-stock]="stockCount < 10" [class.text-danger]="stockCount === 0" [class.text-success]="stockCount > 0">
      {{ stockCount > 0 ? 'In Stock' : 'Out of Stock' }}
    </span>
    <span class="stock-number" [class.text-danger]="stockCount < 10">
      {{ stockCount }} units left
    </span>
  </div>
  <mat-progress-bar 
    mode="determinate" 
    [value]="(stockCount / totalInitialStock) * 100"
    [color]="stockCount < 10 ? 'warn' : 'primary'">
  </mat-progress-bar>
</div>
    <div class="seller-info">
      <img [src]="'https://material.angular.dev/assets/img/examples/shiba1.jpg'" class="seller-avatar" alt="Seller">
      <div class="seller-details">
        <span class="seller-name">Shiba Store</span>
        <span class="sales-count">100+ Sold</span>
      </div>
      <div class="rating">
        <mat-icon>star</mat-icon>
        <span>4.5</span>
      </div>
    </div>
  </mat-card-content>

  <mat-divider></mat-divider>

  <mat-card-actions align="end">
    <button mat-icon-button  title="Add to Wishlist" (aria-label="Add to Wishlist") (click)="checked = !checked" >
      <mat-icon [class]="checked ? 'heart-danger' : ''">{{checked?'favorite':'favorite_border'}}</mat-icon>
    </button>
    <button mat-flat-button color="primary" class="buy-button">
      <mat-icon >shopping_cart</mat-icon>
      ADD TO CART
    </button>
  </mat-card-actions>
</mat-card>
