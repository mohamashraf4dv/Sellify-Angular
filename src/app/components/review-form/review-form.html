<div class="write-review-card">
  <h3>Experience with this product</h3>



  <form  (submit)="submitReview($event)">
    
      <div class="star-rating">
    @for (star of [1,2,3,4,5]; track star) {
    <button type="button" (mouseenter)="hoverRating.set(star)" (mouseleave)="hoverRating.set(0)" (click)="setRating(star)"
      [class.filled]="(hoverRating() || rating()) >= star">
      <svg viewBox="0 0 24 24">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
      </svg>
    </button>
    }
    <span class="rating-label" [class.error]="rating() == 0">
      {{ rating() > 0 ? rating() + '/5 Stars' : 'Select a rating' }}
    </span>
  </div>

    <div class="identity-toggle-container mb-4">
      <div class="toggle-track">
        <div class="toggle-slider" [class.slide-right]="isAnonymous()"></div>
        <button type="button" class="toggle-btn" [class.active]="!isAnonymous()" (click)="setIdentity(false)">
          <i class="bi bi-person-fill me-1"></i> Public Name
        </button>
        <button type="button" class="toggle-btn" [class.active]="isAnonymous()" (click)="setIdentity(true)">
          <i class="bi bi-incognito me-1"></i> Anonymous
        </button>
        <!-- <input type="radio" [value] ="true"[formField]="reviewForm.isReviewedAnonymously" hidden> -->
        <!-- <input type="radio" [value]="false" [formField]="reviewForm.isReviewedAnonymously" hidden> -->
        <!-- <button type="button" class="toggle-btn" [class.active]="!isAnonymous()" (click)="setIdentity(false)">
          <i class="bi bi-person-fill me-1"></i> Public Name
        </button>
        <button type="button" class="toggle-btn" [class.active]="isAnonymous()" (click)="setIdentity(true)">
          <i class="bi bi-incognito me-1"></i> Anonymous
        </button>
        <input type="radio" class="toggle-btn" [class.active]="!isAnonymous()" (click)="setIdentity(false)" hidden>
          <i class="bi bi-person-fill me-1"></i> Public Name
        <input type="radio" class="toggle-btn" [class.active]="isAnonymous()" (click)="setIdentity(true)" hidden>
          <i class="bi bi-incognito me-1"></i> Anonymous -->
      </div>
      <p class="toggle-hint mt-2 mb-0">
        {{ isAnonymous() ? 'Your identity will be hidden from everyone.' : 'Your full name will be visible on this review.' }}
      </p>
    </div>

    <div class="input-group">
      <textarea [formField]="reviewForm.description" placeholder="What did you like or dislike?" class="glass-input">
      </textarea>

      <div class="input-footer">
        <span [class.error]="isOverLimit()">{{ charCount() }}/500</span>
        <button class="submit-btn" type="submit" [disabled]="reviewForm().invalid()">
          Post Review
        </button>
      </div>
    </div>
  </form>
</div>
