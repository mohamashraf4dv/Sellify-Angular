<div class="container-fluid bg-light min-vh-screen p-0 ">
<div class="row g-0">
 <div class="col-lg-11 p-3 mx-auto">
          <div class="card border-0 shadow-sm rounded-4 p-3">
            <h5 class="fw-bold mb-4 ps-2">Recent Orders</h5>
            <div class="list-group list-group-flush">
                @for(order of orders(); track $index ){
              <div class="list-group-item border-0 px-2 py-3 bg-transparent">
                <div class="d-flex align-items-center justify-content-between">
                  <div>
                    <h6 class="mb-0 fw-bold">#{{order.id}}</h6>
                    <small class="text-muted">{{order.customer}}</small>
                  </div>
                  <div class="text-end">
                    <span class="d-block fw-bold">{{order.total | currency}}</span>
                    <span class="badge bg-primary-subtle text-primary x-small">{{order.status}}</span>
                  </div>
                </div>
              </div>
            }
            </div>
          </div>
        </div>
        </div>
        </div>
