    <div class="container-fluid bg-light min-vh-screen p-0 ">
    <div class="row g-0">
       <div class="col-lg-11 p-3 mx-auto">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden ">
            <div class="card-header bg-white border-0 py-4 px-4 d-flex justify-content-between align-items-center">
              <h5 class="fw-bold mb-0">Inventory Manager</h5>
              <div class="input-group w-50">
                <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="Search products...">
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                  <tr>
                    <th class="ps-4 border-0 text-muted small">PRODUCT</th>
                    <th class="border-0 text-muted small">PRICE</th>
                    <th class="border-0 text-muted small">QUANTITY</th>
                    <th class="border-0 text-muted small">STATUS</th>
                    <th class="pe-4 border-0 text-muted small text-end">ACTIONS</th>
                  </tr>
                </thead>
                <tbody>
                @for(p of products() ; track p.id){
                  <tr >
                    <td class="ps-4 fw-semibold text-dark">{{p.name}}</td>
                    <td>{{p.price | currency}}</td>
                    <td>
                      <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-sm btn-outline-secondary rounded-circle px-2" >-</button>
                        <span class="fw-bold">{{p.quantity}}</span>
                        <button class="btn btn-sm btn-outline-secondary rounded-circle px-2">+</button>
                      </div>
                    </td>
                    <td>
                      <span [class]="p.quantity > 5 ? 'badge rounded-pill bg-success-subtle text-success' : 'badge rounded-pill bg-danger-subtle text-danger'">
                        {{ p.quantity > 5 ? 'Stable' : 'Low Stock' }}
                      </span>
                    </td>
                    <td class="pe-4 text-end">
                    <button class="btn btn-light btn-sm rounded-circle me-2 text-primary shadow-sm" title="Edit">
                        <mat-icon>edit</mat-icon>
                    </button>
                    
                    <button class="btn btn-light btn-sm rounded-circle text-danger shadow-sm" title="Delete">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                    </td>
                  </tr>
                }

                </tbody>
              </table>
            </div>
          </div>
          </div>
    </div>
