<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-secondary">Product Inventory</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" routerLink="add">
      <i class="bi bi-plus-lg"></i> Add New Product
    </button>
  </div>

  <div class="table-responsive shadow-sm rounded border">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products()">
          <td><img [src]="product.imageUrl" class="rounded" width="45" height="45" alt="product"></td>
          <td>
            <strong>{{ product.name }}</strong><br>
            <small class="text-muted text-truncate d-inline-block" style="max-width: 200px;">{{ product.description }}</small>
          </td>
          <td>${{ product.price }}</td>
          <td>
            <span [class]="product.quantity > 5 ? 'badge bg-success' : 'badge bg-danger'">
              {{ product.quantity }} in stock
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#productModal" (click)="prepareEdit()">Edit</button>
            <button class="btn btn-sm btn-outline-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ isEditMode() ? 'Update' : 'Add' }} Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form #productForm="">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" name="name" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Price ($)</label>
                <input type="number" class="form-control"name="price" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control"  name="qty" required>
              </div>
              <div class="col-12">
                <label class="form-label">Image URL</label>
                <input type="text" class="form-control"  name="img">
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="3" name="desc"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="saveProduct()" data-bs-dismiss="modal">Save Product</button>
        </div>
      </div>
    </div>
  </div>
</div>
