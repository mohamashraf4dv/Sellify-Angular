
        <div class="review-card">
            <div class="star-rating-display">
                @for (star of [1, 2, 3, 4, 5]; track star) {
                <span class="star" [class.filled]="review()?.stars">★</span>
                }
            </div>
            <p>"{{ review()?.review }}"</p>
            <small>- {{ review()?.user | titlecase }}</small>
        </div>
