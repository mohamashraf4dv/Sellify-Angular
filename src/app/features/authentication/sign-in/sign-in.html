 <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 rounded-5 shadow-lg overflow-hidden">
                    <div class="card-body p-5">

                        <div class="text-center mb-4">
                            <i class="fas fa-shield-alt display-1 mb-3"></i>
                            <h2 class="fw-black header">Login your account</h2>
                        </div>

                        <form [formGroup]="_signInFormGroup" (submit)="onSubmit($event)">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control border-secondary-subtle" placeholder="Username Or Email" formControlName="loginIdentifier" >
                                <label class="text-muted">Username or Email</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control border-secondary-subtle" placeholder="Password" formControlName="password">
                                <label class="text-muted">Password</label>
                            </div>

                            <div class="form-check mb-5">
                                <input class="form-check-input border-secondary-subtle"
                                       type="checkbox"
                                       formControlName="persistence" 
                                       id="rememberMe" >
                                <label class="form-check-label text-muted"
                                       for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                                <div class="d-grid mt-5">
                                    <button type="submit" class="btn rounded-pill py-2 fw-bold fs-5 shadow btn-submit" [disabled]="IsSubmitting() || !_signInFormGroup.valid">
                                        @if(IsSubmitting()){
                                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                            Signing in
                                        }@else{
                                            Sign in
                                        }
                                    </button>
                                </div>
                                 <div class="form-check my-2 text-danger text-center">
                                    {{errorMessage()}}
                                </div>
                        </form>

                        <div class="mt-4 text-center">
                            <p class="text-muted small">
                                Don't have an account?
                                <a routerLink="/register" class="text-primary text-decoration-none fw-bold cursor-pointer">Register now</a>
                            </p>
                        </div>
                        <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1 border-secondary-subtle">
                        <span class="mx-3 text-muted small fw-bold">OR</span>
                        <hr class="flex-grow-1 border-secondary-subtle">
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-outline-dark rounded-pill py-2 fw-bold d-flex align-items-center justify-content-center shadow-sm google-btn" (click)="signInWithGoogle()" [disabled]="IsSubmitting()">
                            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google Logo" class="me-2" style="width: 20px;">
                            Continue with Google
                        </button>
                    </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
